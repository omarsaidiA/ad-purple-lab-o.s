[project]
name = "ad-purple-lab"
version = "0.1.0"
description = "Outils d'analyse défensive pour un lab Active Directory"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ad_triage"]

[tool.mypy]
strict = true
files = ["scripts", "tests", "detections/tests"]
